name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Run fast checks
        run: pnpm check
      - name: Verify package
        run: pnpm verify:package
      - name: Verify Quality compatibility
        run: pnpm verify:quality-compatibility
      - name: Verify Test compatibility
        run: pnpm verify:test-compatibility
      - name: Verify Git Hooks compatibility
        run: pnpm verify:git-hooks-compatibility
      - name: Verify CI compatibility
        run: pnpm verify:ci-compatibility
